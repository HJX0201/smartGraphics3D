name: Bug report
description: 报告可复现的软件问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请勿上传客户模型、诊断包、密钥或其他敏感数据。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v0.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: configuration
    attributes:
      label: 配置
      options:
        - x64 Release
        - x64 Debug
        - 自行构建
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用不含敏感信息的最小步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、显卡/驱动、Qt/OCCT 来源。
